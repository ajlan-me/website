# On every push to main: build the site and publish the finished files to the
# `site-build` branch, which GitHub Pages serves (Settings → Pages → Deploy
# from a branch → site-build / root). Never edit `site-build` by hand.
name: Build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - run: npm run build:prod
      - name: Push built site to site-build branch
        run: |
          cd dist
          git init -q -b site-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site-build
